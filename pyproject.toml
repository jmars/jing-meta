[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jing-meta"
version = "0.1.0"
description = "Unified self-hosted knowledge system — DAFSA indexer, cross-domain search, memory graph, and auto-gardening, all offline."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arch" }]
license = { text = "MIT" }
keywords = ["knowledge-graph", "dafsa", "search", "memory", "indexer"]
dependencies = [
    "numpy>=2.0",
    "requests>=2.25,<3",
    "mcp>=1.23,<2",
    "fastembed>=0.8",
    "onnxruntime>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.15",
]

[project.scripts]
jing-indexer = "indexer.__main__:main"
jing-search = "search.server:main"
jing-memory = "memory.__main__:main"
jing-dreamer = "dreamer.__main__:main"
jing-archiver = "memory.archiver:main"
jing-memory-stats = "memory.stats_server:main"
jing-gardener-hook = "jing_meta.hooks.gardener:main"
jing-archiver-hook = "jing_meta.hooks.archiver:main"
jing-context-bootstrap = "jing_meta.hooks.context:main"
jing-enforce-memory = "jing_meta.hooks.enforce:main"
jing-enforce-report = "jing_meta.hooks.report:main"
jing-maintenance-digest = "jing_meta.hooks.common:digest_cli"
jing-meta = "jing_meta.cli:main"
jing-index-hook = "jing_meta.hooks.indexhook:main"

[tool.hatch.build.targets.wheel]
packages = ["jing_meta", "indexer", "search", "memory", "dreamer"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the C DAFSA shared lib into the wheel so jing-indexer / jing-search
# work after a `uv tool install` (libdafsa.so is gitignored and not otherwise
# shipped; the ctypes layer resolves it relative to the installed package).
"indexer/dafsa/libdafsa.so" = "indexer/dafsa/libdafsa.so"

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["jing_meta", "indexer", "search", "memory", "dreamer"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_no_return = false
show_error_codes = true

